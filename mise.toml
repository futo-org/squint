[tools]
node = "26.13.1"
pnpm = "12.20.0"

[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-x64", "macos-arm64", "macos-x64"]

[tasks.version]
description = "Add the release notes for a version from the commits since the last version"
usage = '''
arg "<version>"
flag "--dry-run" help="Print the release notes and change nothing"
'''
run = '''
set -e
notes="server/src/resources/release-notes.json"
pnpm --filter squint-server build
if [ "{{usage.dry_run}}" = "true" ]; then
  node server/dist/bin/release-notes.js --next {{usage.version}}
  exit 0
fi
node server/dist/bin/release-notes.js --next {{usage.version}} --out "$notes"
pnpm exec prettier --write "$notes"
'''
