name: squint

services:
  server:
    build: .
    environment:
      SQUINT_DB_URL: postgres://postgres:postgres@database:5432/squint
      SQUINT_S3_ENDPOINT: http://storage:9000
      SQUINT_S3_BUCKET: squint
      SQUINT_S3_ACCESS_KEY_ID: squint
      SQUINT_S3_SECRET_ACCESS_KEY: squint-secret
      SQUINT_S3_FORCE_PATH_STYLE: true
      SQUINT_OAUTH_CLIENT_ID: ${SQUINT_OAUTH_CLIENT_ID:-}
      SQUINT_OAUTH_CLIENT_SECRET: ${SQUINT_OAUTH_CLIENT_SECRET:-}
      SQUINT_GITHUB_WEBHOOK_SECRET: ${SQUINT_GITHUB_WEBHOOK_SECRET:-}
      SQUINT_CI_OWNERS: ${SQUINT_CI_OWNERS:-futo-org,immich-app}
    ports:
      - 3000:3000
    depends_on:
      database:
        condition: service_healthy
      storage-bucket:
        condition: service_completed_successfully

  database:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: squint
    ports:
      - 5432:5432
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-d', 'squint']
      interval: 5s

  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: squint
      RUSTFS_SECRET_KEY: squint-secret
    ports:
      - 9000:9000
    volumes:
      - storage:/data

  storage-bucket:
    image: amazon/aws-cli:2.31.0
    environment:
      AWS_ACCESS_KEY_ID: squint
      AWS_SECRET_ACCESS_KEY: squint-secret
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['sh', '-c']
    command:
      - until aws --endpoint-url http://storage:9000 s3 mb s3://squint 2>&1 | grep -q -E 'make_bucket|BucketAlreadyOwnedByYou'; do sleep 1; done
    depends_on:
      - storage

volumes:
  database:
  storage:
